<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sietesodas</title>
<style>
  :root { --fondo: #fafaf7; --texto: #1c1c1a; --suave: #6b6b66; --linea: #dcdcd4; --acento: #1d4ed8; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.45 system-ui, sans-serif; color: var(--texto); background: var(--fondo); }
  main { max-width: 760px; margin: 0 auto; padding: 1.25rem 1rem 4rem; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.02em; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--texto); background: var(--texto); color: var(--fondo); padding: .45rem .9rem; border-radius: 6px; }
  button.sec { background: transparent; color: var(--texto); border-color: var(--linea); }
  input, select, textarea { width: 100%; padding: .5rem .6rem; border: 1px solid var(--linea); border-radius: 6px; background: #fff; }
  form.busqueda { display: grid; grid-template-columns: 1fr auto; gap: .5rem; margin: 1rem 0 .5rem; }
  nav { display: flex; flex-wrap: wrap; gap: .4rem; margin: .5rem 0 .25rem; }
  nav button { padding: .25rem .7rem; font-size: .9rem; }
  nav button.activa { background: var(--texto); color: var(--fondo); border-color: var(--texto); }
  nav button:not(.activa) { background: transparent; color: var(--texto); border-color: var(--linea); }
  .estado { color: var(--suave); font-size: .85rem; margin: .25rem 0 1rem; }
  .tarjeta { border: 1px solid var(--linea); background: #fff; border-radius: 8px; padding: .8rem 1rem; margin-bottom: .6rem; cursor: pointer; transition: transform .15s ease-out, box-shadow .15s ease-out; }
  @media (hover: hover) { .tarjeta:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.07); } }
  .tarjeta h3 { margin: 0; font-size: 1.05rem; }
  .cab { display: flex; justify-content: space-between; gap: 1rem; width: 100%; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; border-radius: 0; }
  .cab:active { transform: none; }
  .tarjeta:not(.abierta) .desc { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
  .extra { display: none; margin-top: .6rem; }
  .tarjeta.abierta .extra { display: block; }
  .meta { color: var(--suave); font-size: .85rem; margin: .15rem 0 .4rem; }
  .tarjeta p { margin: 0; white-space: pre-wrap; }
  .acciones { margin-top: .6rem; }
  #publicar { display: none; border: 1px solid var(--linea); background: #fff; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
  #publicar.abierto { display: grid; gap: .6rem; }
  #publicar { view-transition-name: formulario; }
  label { display: grid; gap: .2rem; font-size: .9rem; color: var(--suave); }
  .nota { margin: 0; font-size: .85rem; color: var(--suave); background: #fffbeb; border: 1px solid #f3e2a9; border-radius: 6px; padding: .5rem .7rem; }
  button { transition: transform .08s; }
  button:active { transform: scale(.97); }
  .vacio { color: var(--suave); animation: aparecer .2s ease-out; }
  button[type=submit] { position: relative; overflow: hidden; }
  button.verificando::after { content: ''; position: absolute; inset: 0 auto 0 0; width: 40%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.28), transparent); animation: barrido 1.1s ease-in-out infinite; }
  @keyframes barrido { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  #abrir-publicar::before { content: '+'; content: '+' / ''; display: inline-block; width: 0; margin-right: 0; overflow: hidden; opacity: 0; transform: rotate(-90deg); transition: width .2s ease-out, margin .2s ease-out, opacity .2s ease-out, transform .25s ease-out; }
  @media (hover: hover) { #abrir-publicar:hover::before { width: .7em; margin-right: .35em; opacity: 1; transform: none; } }
  #abrir-publicar:focus-visible::before { width: .7em; margin-right: .35em; opacity: 1; transform: none; }
  button.listo { animation: aparecer .2s ease-out; }
  .tarjeta.nueva { animation: destacar 2.5s ease-out .2s backwards; }
  @keyframes destacar { from { background: #e6e5d6; } }
  @keyframes aparecer { from { opacity: 0; } }
  /* Transiciones entre listados: las tarjetas que se quedan se deslizan, las demás se desvanecen. */
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; }
  ::view-transition-group(*) { animation-duration: .2s; animation-timing-function: ease-out; }
  ::view-transition-old(*), ::view-transition-new(*) { animation-duration: .2s; }
  @media (prefers-reduced-motion: reduce) {
    ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none; }
    button, .tarjeta { transition: none; }
    .tarjeta:hover { transform: none; }
    button:active { transform: none; }
    .vacio, button.listo, .tarjeta.nueva { animation: none; }
    button.verificando::after { display: none; }
    #abrir-publicar::before { transition: none; }
  }
  .error { color: #b91c1c; font-size: .9rem; }
  .aviso { background: #ecfdf3; border: 1px solid #a7e3bd; border-radius: 6px; padding: .6rem .8rem; font-size: .9rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1>sietesodas</h1>
    <button id="abrir-publicar" type="button">Publicar</button>
  </header>

  <form id="publicar" autocomplete="off">
    <label>Título <input name="titulo" maxlength="100" required></label>
    <label>Categoría <select name="categoria" required></select></label>
    <label>Precio ($, opcional) <input name="precio" type="number" min="0" step="any"></label>
    <label>Descripción <textarea name="descripcion" rows="4" maxlength="2000"></textarea></label>
    <p class="nota">Al publicar, el botón para borrar el anuncio aparecerá solo en este navegador. No hay otra forma de acceder al anuncio, así que no borres los datos del navegador si quieres conservar el control.</p>
    <div><button type="submit">Publicar</button> <button type="button" class="sec" id="cancelar-publicar">Cancelar</button></div>
    <div class="error" id="error-publicar"></div>
  </form>
  <div id="aviso" class="aviso" hidden></div>

  <form class="busqueda" id="busqueda">
    <input name="q" type="search" placeholder="Buscar guitarra, pedal, bajo…">
    <button type="submit">Buscar</button>
  </form>
  <nav id="categorias" aria-label="Categorías"></nav>
  <div class="estado" id="estado"></div>
  <section id="resultados"></section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const el = (tag, texto, clase) => {
  const e = document.createElement(tag);
  if (texto !== undefined) e.textContent = texto;
  if (clase) e.className = clase;
  return e;
};

let categorias = [];
let categoria = '';
const RADIO_KM = 10; // el servidor lo limita a su máximo
let ubicacion = { lat: -34.9011, lng: -56.1645, real: false }; // Montevideo, por defecto

const mias = () => JSON.parse(localStorage.getItem('mias') || '{}');
const guardarMias = (m) => localStorage.setItem('mias', JSON.stringify(m));

async function api(metodo, ruta, cuerpo, token, extra) {
  const cabeceras = { ...extra };
  if (cuerpo) cabeceras['content-type'] = 'application/json';
  if (token) cabeceras['x-owner-token'] = token;
  const r = await fetch(ruta, { method: metodo, headers: cabeceras, body: cuerpo ? JSON.stringify(cuerpo) : undefined });
  if (!r.ok) throw new Error((await r.text()) || 'Error ' + r.status);
  return r.status === 204 ? null : r.json();
}

const nombreCategoria = (id) => (categorias.find((c) => c.id === id) || {}).nombre || id;

// Prueba de trabajo (ALTCHA, PBKDF2/SHA-256): busca un contador cuya clave derivada
// empiece por el prefijo exigido. El servidor emite el desafío y lo verifica.
const aBytes = (hex) => Uint8Array.from(hex.match(/../g) || [], (b) => parseInt(b, 16));
const aHex = (bytes) => [...bytes].map((b) => b.toString(16).padStart(2, '0')).join('');

async function resolverDesafio(desafio) {
  const p = desafio.parameters;
  const nonce = aBytes(p.nonce), salt = aBytes(p.salt), prefijo = aBytes(p.keyPrefix);
  for (let contador = 0; ; contador++) {
    const clave = new Uint8Array(nonce.length + 4);
    clave.set(nonce);
    new DataView(clave.buffer).setUint32(nonce.length, contador); // big-endian
    const base = await crypto.subtle.importKey('raw', clave, 'PBKDF2', false, ['deriveBits']);
    const bits = new Uint8Array(await crypto.subtle.deriveBits(
      { name: 'PBKDF2', hash: 'SHA-256', salt, iterations: p.cost }, base, p.keyLength * 8));
    if (prefijo.every((b, i) => bits[i] === b)) return { counter: contador, derivedKey: aHex(bits) };
  }
}

function pintarCategorias() {
  const nav = $('#categorias');
  nav.replaceChildren();
  for (const c of [{ id: '', nombre: 'Todas' }, ...categorias]) {
    const b = el('button', c.nombre, c.id === categoria ? 'activa' : '');
    b.type = 'button';
    b.onclick = () => { categoria = c.id; pintarCategorias(); buscar(); };
    nav.append(b);
  }
}

// Anima un cambio de la página con View Transitions; sin soporte, actualiza directo.
function animar(actualizar) {
  if (!document.startViewTransition) return actualizar();
  document.startViewTransition(actualizar);
}
let primeraCarga = true; // el primer listado aparece sin animar

async function buscar(destacar) {
  const f = new FormData($('#busqueda'));
  const cuerpo = { lat: ubicacion.lat, lng: ubicacion.lng, radius_km: RADIO_KM };
  if (categoria) cuerpo.category = categoria;
  if (f.get('q').trim()) cuerpo.q = f.get('q').trim();
  const res = $('#resultados');
  try {
    const posts = await api('POST', '/search', cuerpo);
    const pintar = () => {
      $('#estado').textContent = (ubicacion.real ? 'Cerca de ti' : 'Cerca del centro de Montevideo (ubicación por defecto)')
        + ' · ' + posts.length + (posts.length === 1 ? ' anuncio' : ' anuncios');
      res.replaceChildren(...posts.map((p) => tarjeta(p, destacar)));
      if (!posts.length) res.append(el('p', 'No hay anuncios con estos filtros.', 'vacio'));
      res.querySelector('.nueva')?.scrollIntoView({ block: 'nearest' });
    };
    if (primeraCarga) { primeraCarga = false; pintar(); } else animar(pintar);
  } catch (e) {
    $('#estado').textContent = 'No se pudo buscar: ' + e.message;
  }
}

function tarjeta(p, destacar) {
  const d = p.payload;
  const c = el('article', undefined, 'tarjeta');
  if (p.id === destacar) c.classList.add('nueva');
  c.style.viewTransitionName = 'p-' + String(p.id).replace(/[^\w-]/g, '_');
  const h = el('h3');
  const cab = el('button', undefined, 'cab');
  cab.type = 'button';
  cab.setAttribute('aria-expanded', 'false');
  cab.append(el('span', d.title), el('span', d.price != null ? '$' + d.price : ''));
  h.append(cab);
  c.append(h, el('div', nombreCategoria(d.category), 'meta'));
  if (d.description) c.append(el('p', d.description, 'desc'));
  // Marcador de lugar: el contacto llegará con el relé de correo.
  const extra = el('div', undefined, 'extra');
  const contactar = el('button', 'Contactar (próximamente)', 'sec');
  contactar.type = 'button';
  contactar.disabled = true;
  extra.append(contactar);
  c.append(extra);
  c.onclick = (e) => {
    if (e.target.closest('.acciones, .extra') || String(getSelection())) return;
    const abrir = !c.classList.contains('abierta');
    animar(() => {
      c.classList.toggle('abierta', abrir);
      cab.setAttribute('aria-expanded', abrir);
    });
  };
  const token = mias()[p.id];
  if (token) {
    const a = el('div', undefined, 'acciones');
    const b = el('button', 'Borrar mi anuncio', 'sec');
    b.type = 'button';
    b.onclick = async () => {
      if (!confirm('¿Borrar este anuncio?')) return;
      try {
        await api('DELETE', '/objects/' + p.id, null, token);
        const m = mias(); delete m[p.id]; guardarMias(m);
        buscar();
      } catch (e) { alert('No se pudo borrar: ' + e.message); }
    };
    a.append(b);
    c.append(a);
  }
  return c;
}

$('#busqueda').onsubmit = (e) => { e.preventDefault(); buscar(); };

const formPublicar = $('#publicar');
$('#abrir-publicar').onclick = () => {
  const abrir = !formPublicar.classList.contains('abierto');
  animar(() => formPublicar.classList.toggle('abierto', abrir));
  if (abrir) formPublicar.elements.titulo.focus();
};
$('#cancelar-publicar').onclick = () => animar(() => formPublicar.classList.remove('abierto'));
// Pausas que dejan ver la animación; no existen si el usuario pidió menos movimiento.
const pausa = (ms) => new Promise((ok) => setTimeout(ok, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : ms));
formPublicar.onsubmit = async (e) => {
  e.preventDefault();
  const f = new FormData(formPublicar);
  const payload = { title: f.get('titulo').trim(), category: f.get('categoria') };
  if (f.get('descripcion').trim()) payload.description = f.get('descripcion').trim();
  if (f.get('precio') !== '') payload.price = Number(f.get('precio'));
  $('#error-publicar').textContent = '';
  const boton = formPublicar.querySelector('button[type=submit]');
  boton.disabled = true;
  boton.textContent = 'Verificando…';
  boton.classList.add('verificando');
  try {
    const [desafio] = await Promise.all([api('GET', '/desafio'), pausa(700)]);
    const pow = JSON.stringify({ challenge: desafio, solution: await resolverDesafio(desafio) });
    const creado = await api('POST', '/objects', { payload, locator: { lat: ubicacion.lat, lng: ubicacion.lng }, owned: true }, null, { 'x-pow': pow });
    const m = mias(); m[creado.id] = creado.owner_token; guardarMias(m);
    boton.classList.replace('verificando', 'listo');
    boton.textContent = '✓ Publicado';
    await pausa(900);
    formPublicar.reset();
    formPublicar.classList.remove('abierto');
    const aviso = $('#aviso');
    aviso.hidden = false;
    aviso.textContent = 'Anuncio publicado. Lo podrás borrar desde este navegador; no hay otra forma de gestionarlo, así que no borres los datos del navegador si quieres conservar el control.';
    buscar(creado.id);
  } catch (err) {
    $('#error-publicar').textContent = err.message;
  } finally {
    boton.disabled = false;
    boton.classList.remove('verificando', 'listo');
    boton.textContent = 'Publicar';
  }
};

async function iniciar() {
  categorias = await api('GET', '/categorias');
  const sel = formPublicar.elements.categoria;
  sel.append(...categorias.map((c) => Object.assign(el('option', c.nombre), { value: c.id })));
  pintarCategorias();
  await new Promise((ok) => {
    if (!navigator.geolocation) return ok();
    navigator.geolocation.getCurrentPosition(
      (pos) => { ubicacion = { lat: pos.coords.latitude, lng: pos.coords.longitude, real: true }; ok(); },
      () => ok(),
      { timeout: 5000 }
    );
  });
  buscar();
}
iniciar();
</script>
</body>
</html>
