[package]
name = "sietesodas"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"

[dependencies]
qhlv = { git = "https://github.com/alpad5/qhlv.git", branch = "main" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
