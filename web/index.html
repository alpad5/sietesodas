<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sietesodas</title>
<style>
  :root { --fondo: #fafaf7; --texto: #1c1c1a; --suave: #6b6b66; --linea: #dcdcd4; --acento: #1d4ed8; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.45 system-ui, sans-serif; color: var(--texto); background: var(--fondo); }
  main { max-width: 760px; margin: 0 auto; padding: 1.25rem 1rem 4rem; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.02em; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--texto); background: var(--texto); color: var(--fondo); padding: .45rem .9rem; border-radius: 6px; }
  button.sec { background: transparent; color: var(--texto); border-color: var(--linea); }
  input, select, textarea { width: 100%; padding: .5rem .6rem; border: 1px solid var(--linea); border-radius: 6px; background: #fff; }
  form.busqueda { display: grid; grid-template-columns: 1fr auto auto; gap: .5rem; margin: 1rem 0 .5rem; }
  form.busqueda input { grid-column: 1; }
  nav { display: flex; flex-wrap: wrap; gap: .4rem; margin: .5rem 0 .25rem; }
  nav button { padding: .25rem .7rem; font-size: .9rem; }
  nav button.activa { background: var(--texto); color: var(--fondo); border-color: var(--texto); }
  nav button:not(.activa) { background: transparent; color: var(--texto); border-color: var(--linea); }
  .estado { color: var(--suave); font-size: .85rem; margin: .25rem 0 1rem; }
  .tarjeta { border: 1px solid var(--linea); background: #fff; border-radius: 8px; padding: .8rem 1rem; margin-bottom: .6rem; }
  .tarjeta h3 { margin: 0; font-size: 1.05rem; display: flex; justify-content: space-between; gap: 1rem; }
  .meta { color: var(--suave); font-size: .85rem; margin: .15rem 0 .4rem; }
  .tarjeta p { margin: 0; white-space: pre-wrap; }
  .acciones { margin-top: .6rem; }
  #publicar { display: none; border: 1px solid var(--linea); background: #fff; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
  #publicar.abierto { display: grid; gap: .6rem; }
  label { display: grid; gap: .2rem; font-size: .9rem; color: var(--suave); }
  .error { color: #b91c1c; font-size: .9rem; }
  .aviso { background: #ecfdf3; border: 1px solid #a7e3bd; border-radius: 6px; padding: .6rem .8rem; font-size: .9rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1>sietesodas</h1>
    <button id="abrir-publicar" type="button">Publicar anuncio</button>
  </header>

  <form id="publicar" autocomplete="off">
    <label>Título <input name="titulo" maxlength="100" required></label>
    <label>Categoría <select name="categoria" required></select></label>
    <label>Precio (€, opcional) <input name="precio" type="number" min="0" step="any"></label>
    <label>Descripción <textarea name="descripcion" rows="4" maxlength="2000"></textarea></label>
    <div><button type="submit">Publicar</button> <button type="button" class="sec" id="cancelar-publicar">Cancelar</button></div>
    <div class="error" id="error-publicar"></div>
  </form>
  <div id="aviso" class="aviso" hidden></div>

  <form class="busqueda" id="busqueda">
    <input name="q" type="search" placeholder="Buscar guitarra, pedal, bajo…">
    <select name="radio" aria-label="Distancia">
      <option value="1">1 km</option>
      <option value="5">5 km</option>
      <option value="10" selected>10 km</option>
    </select>
    <button type="submit">Buscar</button>
  </form>
  <nav id="categorias" aria-label="Categorías"></nav>
  <div class="estado" id="estado"></div>
  <section id="resultados"></section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const el = (tag, texto, clase) => {
  const e = document.createElement(tag);
  if (texto !== undefined) e.textContent = texto;
  if (clase) e.className = clase;
  return e;
};

let categorias = [];
let categoria = '';
let ubicacion = { lat: 40.4168, lng: -3.7038, real: false }; // Madrid, por defecto

const mias = () => JSON.parse(localStorage.getItem('mias') || '{}');
const guardarMias = (m) => localStorage.setItem('mias', JSON.stringify(m));

async function api(metodo, ruta, cuerpo, token) {
  const cabeceras = {};
  if (cuerpo) cabeceras['content-type'] = 'application/json';
  if (token) cabeceras['x-owner-token'] = token;
  const r = await fetch(ruta, { method: metodo, headers: cabeceras, body: cuerpo ? JSON.stringify(cuerpo) : undefined });
  if (!r.ok) throw new Error((await r.text()) || 'Error ' + r.status);
  return r.status === 204 ? null : r.json();
}

const nombreCategoria = (id) => (categorias.find((c) => c.id === id) || {}).nombre || id;

function pintarCategorias() {
  const nav = $('#categorias');
  nav.replaceChildren();
  for (const c of [{ id: '', nombre: 'Todas' }, ...categorias]) {
    const b = el('button', c.nombre, c.id === categoria ? 'activa' : '');
    b.type = 'button';
    b.onclick = () => { categoria = c.id; pintarCategorias(); buscar(); };
    nav.append(b);
  }
}

async function buscar() {
  const f = new FormData($('#busqueda'));
  const cuerpo = { lat: ubicacion.lat, lng: ubicacion.lng, radius_km: Number(f.get('radio')) };
  if (categoria) cuerpo.category = categoria;
  if (f.get('q').trim()) cuerpo.q = f.get('q').trim();
  const res = $('#resultados');
  try {
    const posts = await api('POST', '/search', cuerpo);
    $('#estado').textContent = (ubicacion.real ? 'Cerca de ti' : 'Cerca de Madrid centro (ubicación por defecto)')
      + ' · ' + posts.length + (posts.length === 1 ? ' anuncio' : ' anuncios');
    res.replaceChildren(...posts.map(tarjeta));
  } catch (e) {
    $('#estado').textContent = 'No se pudo buscar: ' + e.message;
  }
}

function tarjeta(p) {
  const d = p.payload;
  const c = el('article', undefined, 'tarjeta');
  const h = el('h3');
  h.append(el('span', d.title), el('span', d.price != null ? d.price + ' €' : ''));
  c.append(h, el('div', nombreCategoria(d.category), 'meta'));
  if (d.description) c.append(el('p', d.description));
  const token = mias()[p.id];
  if (token) {
    const a = el('div', undefined, 'acciones');
    const b = el('button', 'Borrar mi anuncio', 'sec');
    b.type = 'button';
    b.onclick = async () => {
      if (!confirm('¿Borrar este anuncio?')) return;
      try {
        await api('DELETE', '/objects/' + p.id, null, token);
        const m = mias(); delete m[p.id]; guardarMias(m);
        buscar();
      } catch (e) { alert('No se pudo borrar: ' + e.message); }
    };
    a.append(b);
    c.append(a);
  }
  return c;
}

$('#busqueda').onsubmit = (e) => { e.preventDefault(); buscar(); };

const formPublicar = $('#publicar');
$('#abrir-publicar').onclick = () => formPublicar.classList.toggle('abierto');
$('#cancelar-publicar').onclick = () => formPublicar.classList.remove('abierto');
formPublicar.onsubmit = async (e) => {
  e.preventDefault();
  const f = new FormData(formPublicar);
  const payload = { title: f.get('titulo').trim(), category: f.get('categoria') };
  if (f.get('descripcion').trim()) payload.description = f.get('descripcion').trim();
  if (f.get('precio') !== '') payload.price = Number(f.get('precio'));
  $('#error-publicar').textContent = '';
  try {
    const creado = await api('POST', '/objects', { payload, locator: { lat: ubicacion.lat, lng: ubicacion.lng }, owned: true });
    const m = mias(); m[creado.id] = creado.owner_token; guardarMias(m);
    formPublicar.reset();
    formPublicar.classList.remove('abierto');
    const aviso = $('#aviso');
    aviso.hidden = false;
    aviso.textContent = 'Anuncio publicado. Lo podrás borrar desde este navegador; no hay otra forma de gestionarlo, así que no borres los datos del navegador si quieres conservar el control.';
    buscar();
  } catch (err) {
    $('#error-publicar').textContent = err.message;
  }
};

async function iniciar() {
  categorias = await api('GET', '/categorias');
  const sel = formPublicar.elements.categoria;
  sel.append(...categorias.map((c) => Object.assign(el('option', c.nombre), { value: c.id })));
  pintarCategorias();
  await new Promise((ok) => {
    if (!navigator.geolocation) return ok();
    navigator.geolocation.getCurrentPosition(
      (pos) => { ubicacion = { lat: pos.coords.latitude, lng: pos.coords.longitude, real: true }; ok(); },
      () => ok(),
      { timeout: 5000 }
    );
  });
  buscar();
}
iniciar();
</script>
</body>
</html>
